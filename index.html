<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MTO2 — Marketing, Publicidade & Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Familjen+Grotesk:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    /* Palette: Sol Nascente (default) */
    --bg: #0b0b0c;
    --surface: #141416;
    --surface-2: #1c1c20;
    --line: rgba(245,239,230,.08);
    --line-2: rgba(245,239,230,.16);
    --ink: #f5efe6;
    --ink-dim: rgba(245,239,230,.62);
    --ink-mute: rgba(245,239,230,.38);
    --accent: #e3242b;
    --accent-2: #ff5b3a;
    --gold: #d4a857;

    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 22px;
    --r-xl: 32px;

    --shadow-1: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 60px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:96px}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Familjen Grotesk',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{overflow-x:hidden;position:relative}

  /* Ambient site background — soft radial light pools + dust grain.
     Sits behind all content; survives palette changes (uses --ink/--accent). */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 86% 8%,
        color-mix(in oklab, var(--ink) 16%, transparent) 0%,
        transparent 60%),
      radial-gradient(50% 45% at 12% 92%,
        color-mix(in oklab, var(--ink) 12%, transparent) 0%,
        transparent 60%),
      radial-gradient(35% 30% at 60% 60%,
        color-mix(in oklab, var(--accent) 8%, transparent) 0%,
        transparent 70%);
    filter:blur(30px);opacity:.7}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(rgba(255,255,255,.4) .5px, transparent .5px),
      radial-gradient(rgba(255,255,255,.25) .5px, transparent .5px);
    background-size:120px 120px, 73px 73px;
    background-position:0 0, 37px 51px;
    opacity:.08;mix-blend-mode:overlay}
  [data-theme="light"] body::before{opacity:.5}
  [data-theme="light"] body::after{opacity:.05}

  /* Lift all content above the ambient layer */
  .nav,.hero,.hero-lines,section,footer,.modal-bg,.sheet,.twk-panel{position:relative;z-index:1}
  .nav{z-index:50}

  /* Type system */
  .display{font-family:'Boldonse',ui-serif,Georgia,serif;font-weight:400;letter-spacing:-.02em;line-height:.95}
  .display-tight{font-family:'Boldonse',ui-serif,Georgia,serif;font-weight:400;letter-spacing:-.03em;line-height:.92}
  .mincho{font-family:'Shippori Mincho B1',serif;font-weight:800}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-feature-settings:"ss01"}
  .eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute);font-weight:500}

  /* Layout */
  .wrap{max-width:1320px;margin:0 auto;padding:0 28px}
  @media(max-width:720px){ .wrap{padding:0 18px} }

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:13px 22px;
    font-weight:600;font-size:14.5px;letter-spacing:.005em;cursor:default;min-height:44px;
    border:1px solid transparent;transition:transform .18s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;
    text-decoration:none;color:inherit;background:transparent;white-space:nowrap;
    font-family:inherit}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn:disabled,.btn[aria-busy="true"]{opacity:.6;cursor:wait;transform:none!important;pointer-events:none}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 8px 22px -10px color-mix(in oklab, var(--accent) 80%, transparent)}
  .btn-primary:hover{background:#fff;color:var(--bg);border-color:#fff}
  .btn-ghost{border-color:var(--line-2);color:var(--ink)}
  .btn-ghost:hover{background:rgba(245,239,230,.06);border-color:var(--line-2)}
  .btn-dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn-dark:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-sm{padding:9px 16px;font-size:13px;min-height:38px}
  .btn-arrow{width:1.1em;height:1.1em}
  /* Loading spinner inside buttons */
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;
    border-right-color:transparent;animation:spin 0.8s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Chip / pill */
  .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
    background:rgba(245,239,230,.06);border:1px solid var(--line);font-size:12px;color:var(--ink-dim)}
  .chip-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(227,36,43,.18)}

  /* Toast (top-right) */
  .toast-wrap{position:fixed;top:90px;right:24px;z-index:2147483645;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 48px)}
  .toast{pointer-events:auto;background:var(--surface);border:1px solid var(--line-2);
    color:var(--ink);padding:12px 16px 12px 14px;border-radius:14px;font-size:13.5px;
    box-shadow:0 18px 50px -18px rgba(0,0,0,.5);
    display:flex;align-items:center;gap:11px;min-width:260px;
    transform:translateY(-8px);opacity:0;transition:transform .25s ease, opacity .25s ease}
  .toast.on{transform:none;opacity:1}
  .toast-mark{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab, var(--accent) 25%, transparent);flex-shrink:0}
  .toast-mark.ok{background:#3aa663;box-shadow:0 0 0 4px rgba(58,166,99,.25)}
  .toast b{color:var(--ink);font-weight:600}
  .toast small{display:block;color:var(--ink-mute);font-size:12px;margin-top:2px}

  /* Video modal */
  .vmodal-bg{position:fixed;inset:0;z-index:120;background:rgba(5,5,7,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s}
  .vmodal-bg.on{opacity:1;pointer-events:auto}
  .vmodal{width:100%;max-width:1100px;aspect-ratio:16/9;
    background:#000;border:1px solid var(--line-2);border-radius:18px;overflow:hidden;
    position:relative;transform:scale(.96);transition:transform .3s}
  .vmodal-bg.on .vmodal{transform:none}
  .vmodal-close{position:absolute;top:-44px;right:0;color:#fff;font-size:13px;
    display:inline-flex;align-items:center;gap:8px;background:transparent;border:0;cursor:default;
    padding:6px 12px;border-radius:999px;font-family:inherit}
  .vmodal-close:hover{background:rgba(255,255,255,.08)}
  .vmodal-placeholder{position:absolute;inset:0;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%, #2a2a2e 0%, #050505 60%);
    color:#fff;text-align:center;padding:40px}
  .vmodal-placeholder .play-big{width:88px;height:88px;border-radius:50%;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
    display:grid;place-items:center;color:#fff;margin-bottom:20px;backdrop-filter:blur(8px)}
  .vmodal-placeholder h4{font-family:'Boldonse',serif;font-size:clamp(28px,3vw,40px);margin:0 0 8px;letter-spacing:-.02em}
  .vmodal-placeholder p{margin:0;color:rgba(255,255,255,.65);font-size:14px;max-width:42ch}

  /* Card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:24px;transition:border-color .2s, transform .2s, background .2s}
  .card:hover{border-color:var(--line-2);transform:translateY(-2px)}

  /* Nav */
  .nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    background:color-mix(in oklab, var(--bg) 76%, transparent);
    border-bottom:1px solid var(--line);
    isolation:isolate}
  /* Photo background — sits under content with dark scrim + blur on top of it */
  .nav::before{content:"";position:absolute;inset:0;z-index:-2;
    background:url("assets/nav-bg.png") center/cover no-repeat;
    opacity:.45;filter:saturate(1.05)}
  .nav::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.7) 100%)}
  .nav-row{display:flex;align-items:center;justify-content:space-between;height:84px;gap:24px;position:relative}
  .nav-links{display:flex;align-items:center;gap:6px}
  .nav-links a{color:var(--ink-dim);text-decoration:none;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:.005em;transition:color .15s, background .15s}
  .nav-links a:hover,.nav-links a.is-on{color:var(--ink);background:rgba(245,239,230,.06)}
  .nav-cta{display:flex;align-items:center;gap:10px}
  .menu-btn{display:none}
  @media(max-width:900px){
    .nav-links{display:none}
    .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;
      border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink)}
    .nav-cta .btn-ghost{display:none}
  }

  /* Logo lockup — uses real MTOKAMURA filmes mark, framed in its native black plaque
     so it stays legible across all palettes (incl. light mode) */
  .lockup{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
  .lockup-mark{display:block;background:#000;border-radius:10px;padding:6px 10px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 6px 18px -8px rgba(0,0,0,.6);
    line-height:0}
  .lockup-mark img{display:block;height:42px;width:auto;object-fit:contain}
  .lockup-text{display:flex;flex-direction:column;line-height:1.05}
  .lockup-text b{font-family:'Boldonse',serif;font-size:15px;letter-spacing:-.02em}
  .lockup-text span{font-size:10px;color:var(--ink-mute);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:500}
  /* footer/big variant */
  .lockup-lg .lockup-mark{padding:10px 14px}
  .lockup-lg .lockup-mark img{height:48px}
  .lockup-lg .lockup-text b{font-size:19px}

  /* HERO */
  .hero{position:relative;padding:48px 0 96px;overflow:hidden}
  .hero-glow{position:absolute;inset:auto -10% -40% 30%;height:80%;pointer-events:none;
    background:radial-gradient(50% 60% at 50% 50%, color-mix(in oklab, var(--accent) 55%, transparent) 0%, transparent 70%);
    filter:blur(60px);opacity:.6;z-index:0}
  .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;min-height:640px}
  @media(max-width:1080px){.hero-grid{grid-template-columns:1fr;min-height:auto;gap:32px}}

  .hero-eyebrow{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px}

  .hero h1{font-size:clamp(46px,7.2vw,108px);margin:0 0 24px;color:var(--ink)}
  .hero h1 em{font-style:normal;color:var(--accent);font-family:inherit}
  .hero h1 .slash{font-family:'Shippori Mincho B1',serif;font-weight:800;color:var(--accent);
    font-size:.9em;display:inline-block;transform:translateY(.04em)}
  .hero p.lead{font-size:clamp(15px,1.25vw,18.5px);color:var(--ink-dim);max-width:54ch;line-height:1.5;margin:0 0 36px}
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:34px}
  .hero-meta{display:flex;align-items:center;gap:18px;color:var(--ink-mute);font-size:13px}
  .hero-meta b{color:var(--ink);font-weight:600}
  .hero-meta .div{width:1px;height:14px;background:var(--line-2)}

  /* Scene */
  .scene{position:relative;aspect-ratio:1/1;width:100%;max-width:620px;justify-self:end}
  @media(max-width:1080px){ .scene{justify-self:center} }
  .scene-stage{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(227,36,43,.18), transparent 62%),
               radial-gradient(circle at 50% 50%, rgba(245,239,230,.04), transparent 70%);
    overflow:visible}

  /* Rising sun rays */
  .rays{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .rays svg{width:120%;height:120%;animation:spin 90s linear infinite}
  .rays-fast svg{animation-duration:50s;animation-direction:reverse;opacity:.45}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .sun-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff7a5a 0%, var(--accent) 38%, #8b0c12 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 30px 80px -20px rgba(227,36,43,.55), inset 0 -20px 60px rgba(0,0,0,.45);
    display:grid;place-items:center;color:#fff;text-align:center}
  .sun-core::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.5), transparent 50%);mix-blend-mode:overlay;opacity:.7}
  .sun-core .num{font-family:'Boldonse',serif;font-size:clamp(28px,4.5vw,52px);line-height:1;letter-spacing:-.02em}
  .sun-core .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:8px;color:rgba(255,255,255,.85);font-family:'JetBrains Mono',monospace}

  /* Orbit nodes (concept A: floating service tags around sun) */
  .orbit{position:absolute;inset:0;pointer-events:none}
  .orbit-ring{position:absolute;left:50%;top:50%;border:1px dashed rgba(245,239,230,.13);border-radius:50%;
    transform:translate(-50%,-50%)}
  .node{position:absolute;pointer-events:auto;cursor:default;
    transform:translate(-50%,-50%)}
  .node-card{animation:float 5s ease-in-out infinite}
  .node-card{display:inline-flex;align-items:center;gap:9px;background:rgba(20,20,22,.78);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line-2);border-radius:14px;padding:9px 13px;color:var(--ink);font-size:13px;font-weight:500;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.7);white-space:nowrap;transition:transform .2s, border-color .2s}
  .node-card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .node-icon{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;flex-shrink:0}
  .node-icon.k{background:transparent;color:var(--accent);font-family:'Shippori Mincho B1',serif;font-size:18px;font-weight:800;width:auto;height:auto;line-height:1}
  .node-tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
    background:#fff;color:var(--bg);font-size:11px;padding:5px 9px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap;font-weight:500}
  .node:hover .node-tip{opacity:1}

  /* Floating kanji */
  .kanji-float{position:absolute;font-family:'Shippori Mincho B1',serif;font-weight:800;
    color:rgba(227,36,43,.55);pointer-events:none;animation:float 7s ease-in-out infinite}

  /* Concept B: reel constellation */
  .reel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:46%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #1a1a1d 0%, #0a0a0b 100%);
    border:1px solid var(--line-2);
    display:grid;place-items:center;overflow:hidden}
  .reel::before{content:"";position:absolute;inset:8%;border-radius:50%;
    border:1px solid var(--line-2);
    background:repeating-conic-gradient(from 0deg, #18181a 0deg 4deg, #0e0e10 4deg 8deg)}
  .reel-hole{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 40% 30%, #2a2a2e, #050505);border:1px solid var(--line-2);
    display:grid;place-items:center;color:var(--accent);z-index:2;animation:spin 12s linear infinite}
  .reel-hole .triangle{width:0;height:0;border-left:14px solid var(--accent);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px;filter:drop-shadow(0 0 12px rgba(227,36,43,.7))}
  .reel-perfs{position:absolute;inset:0;animation:spin 60s linear infinite}
  .reel-perfs span{position:absolute;left:50%;top:50%;width:6%;aspect-ratio:1;border-radius:50%;
    background:#050505;border:1px solid var(--line-2);
    transform:translate(-50%,-50%) rotate(var(--a)) translateY(-38%)}

  /* SECTIONS */
  section.bk{padding:90px 0;border-top:1px solid var(--line)}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:48px}
  .sec-head h2{font-family:'Boldonse',serif;font-size:clamp(34px,4.8vw,60px);margin:0;line-height:.95;letter-spacing:-.02em;max-width:18ch}
  .sec-head .sub{color:var(--ink-dim);max-width:42ch;font-size:15px;line-height:1.5}
  @media(max-width:780px){.sec-head{flex-direction:column;align-items:flex-start}}

  /* Stats strip */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat{padding:36px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .stat:last-child{border-right:0}
  .stat .num{font-family:'Boldonse',serif;font-size:clamp(36px,4.5vw,56px);line-height:1;letter-spacing:-.02em}
  .stat .num em{color:var(--accent);font-style:normal}
  .stat .lbl{color:var(--ink-mute);font-size:12.5px;letter-spacing:.04em}
  @media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line)}}

  /* Services grid */
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:980px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.svc-grid{grid-template-columns:1fr}}
  .svc{position:relative;padding:30px;border-radius:var(--r-lg);background:var(--surface);
    border:1px solid var(--line);overflow:hidden;min-height:240px;
    display:flex;flex-direction:column;justify-content:space-between;gap:32px;cursor:default;
    text-align:left;font:inherit;color:inherit;width:100%;font-family:inherit}
  .svc:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .svc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .svc-kanji{position:absolute;right:-10px;bottom:-30px;font-family:'Shippori Mincho B1',serif;
    font-weight:800;font-size:140px;color:rgba(227,36,43,.08);line-height:.8;pointer-events:none;transition:color .25s, transform .35s}
  .svc:hover .svc-kanji{color:rgba(227,36,43,.22);transform:translateY(-6px)}
  .svc-num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--ink-mute)}
  .svc h3{font-family:'Boldonse',serif;font-size:24px;letter-spacing:-.01em;margin:0 0 8px;line-height:1.05}
  .svc p{margin:0;color:var(--ink-dim);font-size:14.5px;line-height:1.5}
  .svc .arrow{position:relative;z-index:2;width:34px;height:34px;border-radius:50%;
    background:rgba(245,239,230,.06);border:1px solid var(--line-2);display:grid;place-items:center;
    transition:background .2s,color .2s,transform .25s}
  .svc:hover .arrow{background:var(--accent);border-color:var(--accent);color:#fff;transform:rotate(-45deg)}

  /* Case feature */
  .case{display:grid;grid-template-columns:1.05fr 1fr;gap:42px;align-items:stretch}
  @media(max-width:980px){.case{grid-template-columns:1fr}}
  .case-vis{position:relative;border-radius:var(--r-lg);overflow:hidden;
    background:linear-gradient(135deg, #1a0606 0%, #0c0c0e 60%);
    border:1px solid var(--line);min-height:460px;padding:32px;
    display:flex;flex-direction:column;justify-content:space-between}
  .case-vis .badge{position:absolute;top:24px;right:24px;font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.16em;color:var(--ink-mute);text-transform:uppercase}
  .case-frame{position:relative;flex:1;display:grid;place-items:center;margin:24px 0}
  .case-burger{font-family:'Boldonse',serif;font-size:clamp(54px,9vw,128px);color:var(--accent);
    line-height:.95;text-align:center;letter-spacing:-.03em}
  .case-burger .amp{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:.7em;
    display:inline-block;color:var(--ink);transform:translateY(-.04em);margin:0 .08em}
  .case-burger small{display:block;font-family:'JetBrains Mono',monospace;font-size:.11em;
    color:var(--ink);letter-spacing:.22em;margin-top:1.2em;text-transform:uppercase;font-weight:500}
  .case-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-top:18px;border-top:1px solid var(--line)}
  .case-stat .n{font-family:'Boldonse',serif;font-size:30px;letter-spacing:-.02em;color:var(--ink)}
  .case-stat .n em{color:var(--accent);font-style:normal}
  .case-stat .l{color:var(--ink-mute);font-size:12px;margin-top:4px}
  .case-text{display:flex;flex-direction:column;justify-content:center;padding:8px 0}
  .case-text h3{font-family:'Boldonse',serif;font-size:clamp(32px,3.6vw,46px);margin:0 0 18px;line-height:1.0;letter-spacing:-.02em}
  .case-text p{color:var(--ink-dim);font-size:16px;line-height:1.55;margin:0 0 22px;max-width:50ch}
  .case-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .tag{padding:6px 11px;border-radius:999px;background:rgba(245,239,230,.05);border:1px solid var(--line);
    font-size:12px;color:var(--ink-dim)}

  /* Clientes / logo cloud */
  .clientes{display:grid;grid-template-columns:repeat(6,1fr);gap:0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cliente{padding:28px;display:grid;place-items:center;border-right:1px solid var(--line);
    color:var(--ink-mute);font-family:'Boldonse',serif;font-size:16px;letter-spacing:-.01em;
    transition:color .2s, background .2s;cursor:default;min-height:84px}
  .cliente:last-child{border-right:0}
  .cliente:hover{color:var(--ink);background:rgba(245,239,230,.03)}
  @media(max-width:980px){.clientes{grid-template-columns:repeat(3,1fr)}
    .cliente:nth-child(3n){border-right:0}.cliente:nth-child(-n+3){border-bottom:1px solid var(--line)}}
  @media(max-width:520px){.clientes{grid-template-columns:repeat(2,1fr)}
    .cliente{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}
    .cliente:nth-child(2n){border-right:0!important}
    .cliente:nth-last-child(-n+2){border-bottom:0}}

  /* Testimonial */
  .quote{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:flex-start;
    padding:48px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line)}
  @media(max-width:780px){.quote{grid-template-columns:1fr;padding:32px}}
  .quote-mark{font-family:'Boldonse',serif;font-size:120px;line-height:.7;color:var(--accent);align-self:flex-start}
  .quote p{font-family:'Boldonse',serif;font-size:clamp(22px,2.4vw,30px);line-height:1.25;letter-spacing:-.01em;margin:0 0 24px}
  .quote .by{display:flex;align-items:center;gap:14px}
  .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg, #d4a857, #e3242b);
    color:#fff;display:grid;place-items:center;font-family:'Boldonse',serif;font-size:18px}

  /* CTA banner */
  .cta-band{position:relative;border-radius:var(--r-xl);padding:64px 56px;overflow:hidden;
    background:linear-gradient(135deg, var(--accent) 0%, #8b0c12 100%);color:#fff;
    display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:center}
  @media(max-width:780px){.cta-band{grid-template-columns:1fr;padding:40px 30px}}
  .cta-band h3{font-family:'Boldonse',serif;font-size:clamp(34px,4.2vw,56px);margin:0;line-height:.95;letter-spacing:-.02em}
  .cta-band p{margin:14px 0 0;color:rgba(255,255,255,.85);font-size:15px;line-height:1.5;max-width:42ch}
  .cta-band-rays{position:absolute;inset:auto -20% -120% auto;width:80%;aspect-ratio:1;
    background:conic-gradient(from 0deg, rgba(255,255,255,.18) 0deg 4deg, transparent 4deg 16deg);
    border-radius:50%;animation:spin 80s linear infinite;mix-blend-mode:overlay;pointer-events:none}
  .cta-band-cta{display:flex;flex-direction:column;gap:12px;align-items:flex-start;justify-self:end}
  @media(max-width:780px){.cta-band-cta{justify-self:start}}
  .cta-band-cta .btn-dark{background:#0b0b0c;color:#fff;border-color:#0b0b0c}
  .cta-band-cta .btn-dark:hover{background:#fff;color:#0b0b0c;border-color:#fff}

  /* Footer */
  footer{padding:80px 0 40px;border-top:1px solid var(--line)}
  .ft-grid{display:grid;grid-template-columns:1.4fr repeat(3, 1fr);gap:40px;margin-bottom:60px}
  @media(max-width:780px){.ft-grid{grid-template-columns:1fr 1fr}}
  .ft-col h4{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 18px;color:var(--ink-mute);font-weight:500}
  .ft-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .ft-col a{color:var(--ink-dim);text-decoration:none;font-size:14px;transition:color .15s}
  .ft-col a:hover{color:var(--ink)}
  .ft-tag{font-family:'Boldonse',serif;font-size:clamp(28px,3.4vw,46px);line-height:1;letter-spacing:-.02em;margin:8px 0 16px;max-width:14ch}
  .ft-bottom{display:flex;justify-content:space-between;align-items:center;gap:24px;
    padding-top:28px;border-top:1px solid var(--line);color:var(--ink-mute);font-size:12.5px;flex-wrap:wrap}
  .ft-bottom .mincho{color:var(--accent)}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(5,5,7,.78);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);z-index:100;display:grid;place-items:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .25s}
  .modal-bg.on{opacity:1;pointer-events:auto}
  .modal{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line-2);
    border-radius:var(--r-xl);padding:40px;transform:translateY(8px) scale(.99);transition:transform .3s ease;
    max-height:calc(100vh - 48px);overflow:auto}
  .modal-bg.on .modal{transform:none}
  .modal h3{font-family:'Boldonse',serif;font-size:32px;margin:0 0 8px;line-height:1.0;letter-spacing:-.02em}
  .modal-close{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;
    background:rgba(245,239,230,.06);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;cursor:default}
  .modal-form{display:flex;flex-direction:column;gap:14px;margin-top:24px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--ink-mute);letter-spacing:.04em;text-transform:uppercase;font-weight:500;font-family:'JetBrains Mono',monospace}
  .field input,.field textarea,.field select{background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;font:inherit;color:var(--ink);outline:none;transition:border-color .15s, background .15s;font-size:14.5px}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:rgba(227,36,43,.06)}
  .field textarea{resize:vertical;min-height:90px}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row-2{grid-template-columns:1fr}}
  .check-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .check-pill{padding:10px 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;color:var(--ink-dim);
    cursor:default;transition:all .15s;background:transparent;font-family:inherit;
    min-height:38px;display:inline-flex;align-items:center}
  .check-pill:hover{border-color:color-mix(in oklab, var(--accent) 50%, var(--line-2));color:var(--ink)}
  .check-pill[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .check-pill[aria-checked="true"]::before{content:"";width:10px;height:10px;margin-right:8px;border-radius:50%;background:#fff;display:inline-block}
  .field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--accent);background:color-mix(in oklab, var(--accent) 8%, var(--surface-2))}
  .field-error{color:var(--accent);font-size:11.5px;margin-top:2px;font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
  .modal-success{text-align:center;padding:16px 0}
  .modal-success .big{font-family:'Shippori Mincho B1',serif;font-size:84px;color:var(--accent);line-height:1;font-weight:800;margin-bottom:14px}

  /* Mobile menu */
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(11,11,12,.94);backdrop-filter:blur(20px);
    padding:24px;display:flex;flex-direction:column;transform:translateY(-100%);transition:transform .35s cubic-bezier(.6,.05,.2,1)}
  .sheet.on{transform:none}
  .sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
  .sheet ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
  .sheet a{display:block;font-family:'Boldonse',serif;font-size:32px;color:var(--ink);text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}

  /* Marquee */
  .marquee{overflow:hidden;border-block:1px solid var(--line);padding:14px 0;background:var(--bg);position:relative}
  .marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
  .marquee::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
  .marquee::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
  .marquee-track{display:flex;gap:48px;animation:scroll 38s linear infinite;width:max-content}
  .marquee-item{display:inline-flex;align-items:center;gap:18px;color:var(--ink-dim);font-size:15px;white-space:nowrap}
  .marquee-item .mincho{color:var(--accent);font-size:22px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* Concept B specifics */
  .concept-b .sun-core{display:none}
  .concept-b .reel-active{display:grid}
  .reel-active{display:none}

  /* Concept C: BackgroundPaths — flowing animated SVG lines, ported from shadcn */
  .hero-lines{position:relative;min-height:88vh;display:grid;place-items:center;padding:80px 0 120px;overflow:hidden}
  .bg-paths{position:absolute;inset:0;pointer-events:none}
  .bg-paths svg{width:100%;height:100%;color:var(--ink)}
  .bg-paths path{stroke:currentColor;fill:none;
    stroke-dasharray:60 380;
    animation:bgPathFlow linear infinite}
  @keyframes bgPathFlow{
    0%{stroke-dashoffset:0;stroke-opacity:.25}
    50%{stroke-opacity:.55}
    100%{stroke-dashoffset:-440;stroke-opacity:.25}
  }
  .hero-lines-inner{position:relative;z-index:2;text-align:center;max-width:960px;padding:0 28px}
  .hero-lines-eyebrow{margin-bottom:32px;justify-content:center;display:inline-flex}
  .hero-lines h1{font-family:'Boldonse',serif;font-size:clamp(54px,9vw,128px);line-height:.92;
    letter-spacing:-.03em;margin:0 0 36px;color:var(--ink)}
  .hero-lines h1 .word{display:inline-block;margin-right:.32em;white-space:nowrap}
  .hero-lines h1 .word:last-child{margin-right:0}
  .hero-lines h1 .letter{display:inline-block;background:linear-gradient(180deg, var(--ink) 0%, color-mix(in oklab, var(--ink) 70%, transparent) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;transform:translateY(80px);animation:letterIn .9s cubic-bezier(.16,1,.3,1) forwards}
  .hero-lines h1 .letter.k{background:linear-gradient(180deg, var(--accent) 0%, color-mix(in oklab, var(--accent) 60%, transparent) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-family:'Shippori Mincho B1',serif;font-weight:800}
  @keyframes letterIn{to{opacity:1;transform:translateY(0)}}
  .hero-lines-sub{max-width:46ch;margin:0 auto 40px;color:var(--ink-dim);font-size:clamp(15px,1.2vw,18px);line-height:1.55;
    opacity:0;animation:letterIn 1s .6s cubic-bezier(.16,1,.3,1) forwards}
  .hero-lines-cta{display:inline-flex;align-items:center;gap:12px;padding:3px;
    background:linear-gradient(180deg, color-mix(in oklab, var(--ink) 18%, transparent), color-mix(in oklab, var(--ink) 4%, transparent));
    border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 16px 48px -12px rgba(0,0,0,.4);
    opacity:0;animation:letterIn 1s .8s cubic-bezier(.16,1,.3,1) forwards}
  .hero-lines-cta-btn{display:inline-flex;align-items:center;gap:14px;padding:18px 32px;border-radius:15px;
    background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:16.5px;font-weight:600;letter-spacing:.005em;
    cursor:default;transition:transform .25s, background .25s, border-color .25s}
  .hero-lines-cta:hover .hero-lines-cta-btn{transform:translateY(-1.5px);border-color:var(--line-2)}
  .hero-lines-cta-btn .arrow{transition:transform .25s, opacity .25s;opacity:.7}
  .hero-lines-cta:hover .hero-lines-cta-btn .arrow{opacity:1;transform:translateX(6px)}

  /* Concept D: Constelação — corner connector lines with labeled service nodes,
     center play badge, vertical light beam, page indicator + scroll hint.
     Based on the user's reference: airy dark canvas, soft glows, ringed iconography. */
  .hero-cons{position:relative;min-height:84vh;display:grid;place-items:center;
    padding:60px 0 100px;overflow:hidden}
  .hero-cons-canvas{position:absolute;inset:24px;border-radius:36px;
    background:radial-gradient(circle at 50% 40%, color-mix(in oklab, var(--ink) 6%, transparent) 0%, transparent 50%);
    border:1px solid var(--line);overflow:hidden;z-index:0}
  .hero-cons-canvas::before{content:"";position:absolute;inset:0;background-image:
      radial-gradient(rgba(255,255,255,.5) .6px, transparent .6px);
    background-size:60px 60px;opacity:.06;pointer-events:none}
  /* Light beams shooting down through center */
  .hero-cons-beams{position:absolute;left:50%;top:40%;bottom:0;width:240px;transform:translateX(-50%);pointer-events:none;z-index:1}
  .hero-cons-beams span{position:absolute;top:0;bottom:0;width:1px;
    background:linear-gradient(180deg, transparent, color-mix(in oklab, var(--ink) 30%, transparent) 40%, transparent);
    filter:blur(.5px)}
  .hero-cons-beams span:nth-child(1){left:50%}
  .hero-cons-beams span:nth-child(2){left:42%;opacity:.6;animation:beamPulse 4s ease-in-out infinite}
  .hero-cons-beams span:nth-child(3){left:58%;opacity:.6;animation:beamPulse 4s 2s ease-in-out infinite}
  @keyframes beamPulse{0%,100%{opacity:.2;transform:scaleY(.9)}50%{opacity:.7;transform:scaleY(1.05)}}

  /* Top center play badge */
  .hero-cons-play{position:absolute;top:9%;left:50%;transform:translateX(-50%);
    width:44px;height:44px;border-radius:50%;background:color-mix(in oklab, var(--ink) 8%, transparent);
    border:1px solid var(--line-2);display:grid;place-items:center;backdrop-filter:blur(8px);
    color:var(--ink);z-index:3;cursor:default;padding:0;font:inherit;transition:transform .2s, background .2s}
  .hero-cons-play:hover{transform:translateX(-50%) scale(1.08);background:var(--accent);border-color:var(--accent);color:#fff}
  .hero-cons-play::after{content:"";position:absolute;inset:-8px;border-radius:50%;
    border:1px solid var(--line);animation:ringExpand 3s ease-out infinite}
  @keyframes ringExpand{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.4);opacity:0}}

  /* Corner connector SVG lines */
  .hero-cons-svg{position:absolute;inset:0;pointer-events:none;z-index:2}
  .hero-cons-svg path{stroke:color-mix(in oklab, var(--ink) 22%, transparent);
    stroke-width:1;fill:none;stroke-dasharray:380;stroke-dashoffset:380;
    animation:lineDraw 2s 0.3s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes lineDraw{to{stroke-dashoffset:0}}

  /* Labeled nodes on corners */
  .cons-node{position:absolute;display:flex;align-items:center;gap:11px;color:var(--ink);font-size:13px;z-index:3;
    opacity:0;animation:nodeIn .6s ease-out forwards}
  @keyframes nodeIn{to{opacity:1}}
  .cons-node-ring{width:42px;height:42px;border-radius:50%;
    background:color-mix(in oklab, var(--ink) 6%, transparent);
    border:1px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;
    backdrop-filter:blur(8px);color:var(--ink)}
  .cons-node-text b{font-weight:600;letter-spacing:.005em;display:block;line-height:1.1}
  .cons-node-text .num{color:var(--ink-mute);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;margin-top:3px;display:block}
  .cons-node.tl{top:18%;left:7%;animation-delay:1.4s}
  .cons-node.tr{top:18%;right:7%;flex-direction:row-reverse;text-align:right;animation-delay:1.6s}
  .cons-node.bl{bottom:22%;left:9%;animation-delay:1.8s}
  .cons-node.br{bottom:22%;right:7%;flex-direction:row-reverse;text-align:right;animation-delay:2s}
  .cons-node.bl .cons-node-text,.cons-node.tl .cons-node-text{text-align:left}

  /* Center stack */
  .hero-cons-stack{position:relative;z-index:4;text-align:center;max-width:920px;padding:0 28px}
  .hero-cons-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
    background:color-mix(in oklab, var(--ink) 8%, transparent);
    border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-dim);backdrop-filter:blur(8px);margin-bottom:30px}
  .hero-cons-chip .glow{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .hero-cons h1{font-family:'Boldonse',serif;font-size:clamp(46px,7.2vw,96px);line-height:.95;
    letter-spacing:-.025em;margin:0 0 18px;color:var(--ink);
    text-wrap:balance}
  .hero-cons h1 em{font-style:normal;font-family:'Shippori Mincho B1',serif;font-weight:800;color:var(--accent)}
  .hero-cons p.sub{max-width:48ch;margin:0 auto 32px;color:var(--ink-dim);
    font-size:clamp(14.5px,1.15vw,17px);line-height:1.55}
  .hero-cons-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .hero-cons-ctas .btn{padding:14px 24px;font-size:14.5px}
  .hero-cons-ctas .btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .hero-cons-ctas .btn-primary:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hero-cons-ctas .btn-ghost{background:color-mix(in oklab, var(--ink) 8%, transparent);
    border-color:var(--line-2);backdrop-filter:blur(8px)}

  /* Bottom-left scroll hint, bottom-right page indicator */
  .hero-cons-scroll{position:absolute;bottom:48px;left:48px;z-index:3;
    display:flex;align-items:center;gap:11px;color:var(--ink-dim);font-size:12.5px;font-family:'JetBrains Mono',monospace}
  .hero-cons-scroll .dot{width:30px;height:30px;border-radius:50%;
    background:color-mix(in oklab, var(--ink) 6%, transparent);
    border:1px solid var(--line-2);display:grid;place-items:center;backdrop-filter:blur(8px);
    color:var(--ink)}
  .hero-cons-scroll .dot svg{animation:arrowBob 2s ease-in-out infinite}
  @keyframes arrowBob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}

  .hero-cons-pager{position:absolute;bottom:48px;right:48px;z-index:3;text-align:right;color:var(--ink-dim);font-size:13px}
  .hero-cons-pager .lbl{font-family:'Boldonse',serif;color:var(--ink);font-size:18px;letter-spacing:-.01em;margin-bottom:8px}
  .hero-cons-pager-bars{display:flex;gap:5px;justify-content:flex-end}
  .hero-cons-pager-bars span{width:22px;height:3px;border-radius:2px;background:var(--line-2)}
  .hero-cons-pager-bars span.on{background:var(--ink);width:44px}

  @media(max-width:780px){
    .hero-cons-canvas{inset:12px;border-radius:24px}
    .cons-node.tl{top:13%;left:5%}
    .cons-node.tr{top:13%;right:5%}
    .cons-node.bl{bottom:30%;left:5%}
    .cons-node.br{bottom:30%;right:5%}
    .cons-node-text{display:none}
    .hero-cons-scroll{bottom:28px;left:28px}
    .hero-cons-pager{bottom:28px;right:28px}
    .hero-cons-pager-bars span{width:14px}
    .hero-cons-pager-bars span.on{width:28px}
  }

  /* Concept E: Cartaz — panoramic poster header using the MTOKAMURA banner. */
  .hero-cartaz{position:relative;min-height:clamp(520px, 78vh, 720px);
    display:grid;place-items:center;background:#000;overflow:hidden;padding:60px 0 80px}
  .cartaz-rays{position:absolute;inset:-10% -5%;display:grid;place-items:center;pointer-events:none;z-index:1}
  .cartaz-rays svg{width:100%;height:100%}
  .cartaz-rays path{fill:#a8181c;opacity:.55}
  .cartaz-rays-2{position:absolute;inset:-15% -5%;display:grid;place-items:center;pointer-events:none;z-index:1}
  .cartaz-rays-2 svg{width:140%;height:140%}
  .cartaz-rays-2 path{fill:#d62224;opacity:.18}
  .cartaz-grunge{position:absolute;inset:0;pointer-events:none;z-index:2;
    background-image:
      radial-gradient(rgba(0,0,0,.5) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:3px 3px, 7px 7px;background-position:0 0, 2px 3px;
    mix-blend-mode:multiply;opacity:.85}
  .cartaz-grunge::before{content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(ellipse 800px 80px at 20% 30%, rgba(0,0,0,.5), transparent 60%),
      radial-gradient(ellipse 600px 100px at 80% 70%, rgba(0,0,0,.6), transparent 60%);
    mix-blend-mode:multiply}
  .cartaz-grunge::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 18%, transparent 82%, rgba(0,0,0,.55) 100%);
    pointer-events:none}
  .cartaz-vignette{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse 70% 60% at 50% 50%, transparent 50%, rgba(0,0,0,.75) 100%)}

  .cartaz-inner{position:relative;z-index:4;width:100%;max-width:1280px;padding:0 40px;
    display:flex;flex-direction:column;align-items:center;gap:36px}
  @media(max-width:780px){ .cartaz-inner{padding:0 20px;gap:24px} }
  .cartaz-banner{width:100%;max-width:1100px;line-height:0;
    filter:drop-shadow(0 30px 60px rgba(168,24,28,.35));
    opacity:0;animation:cartazIn .9s .15s cubic-bezier(.16,1,.3,1) forwards;
    -webkit-mask-image:radial-gradient(ellipse 85% 90% at 50% 50%, #000 55%, transparent 100%);
            mask-image:radial-gradient(ellipse 85% 90% at 50% 50%, #000 55%, transparent 100%)}
  .cartaz-banner img{width:100%;height:auto;display:block}
  @keyframes cartazIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}

  .cartaz-sub{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;

  .cartaz-sub .div{width:6px;height:6px;border-radius:50%;background:#d62224;box-shadow:0 0 10px #d62224;flex-shrink:0}
  .cartaz-sub .red{color:#e3242b}
  @media(max-width:780px){ .cartaz-sub{font-size:11px;letter-spacing:.12em} }

  .cartaz-cta{display:inline-flex;align-items:center;gap:14px;padding:18px 32px;
    background:#d62224;color:#fff;border:2px solid #d62224;border-radius:0;

    cursor:default;position:relative;
    box-shadow:6px 6px 0 #000, 6px 6px 0 1px #d62224;

    transition:transform .2s, box-shadow .2s, background .2s, color .2s}
  .cartaz-cta:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 #000, 9px 9px 0 1px #d62224;background:#fff;color:#000}
  .cartaz-cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000, 2px 2px 0 1px #d62224}
  .cartaz-cta svg{transition:transform .2s}
  .cartaz-cta:hover svg{transform:translateX(4px)}

  /* When cartaz hero is active, intensify the photo nav (more visible image) */
  .has-cartaz .nav{background:rgba(0,0,0,.4);border-bottom-color:rgba(255,255,255,.08)}
  .has-cartaz .nav::before{opacity:.7}
  .has-cartaz .nav::after{background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.65) 100%)}

  /* Concept F: Onda — Three.js dotted-surface wave. */
  .hero-onda{position:relative;min-height:88vh;display:grid;place-items:center;

  .onda-glow{position:absolute;inset:-10% -10% auto -10%;height:80%;z-index:2;pointer-events:none;

  .onda-vignette{position:absolute;inset:0;z-index:2;pointer-events:none;

  .onda-inner{position:relative;z-index:3;text-align:center;max-width:880px;padding:0 28px;color:#fff}
  .onda-eyebrow{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;

    font-family:'JetBrains Mono',monospace;letter-spacing:.08em}
  .onda-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:#d62224;box-shadow:0 0 12px #d62224}
  .onda h1{font-family:'Boldonse',serif;font-size:clamp(46px,7vw,96px);line-height:.95;
    letter-spacing:-.025em;margin:0 0 18px;color:#fff;text-wrap:balance}
  .onda h1 em{font-style:normal;color:#d62224;font-family:inherit}
  .onda h1 .k{font-family:'Shippori Mincho B1',serif;font-weight:800;color:#d62224}
  .onda p{font-size:clamp(15px,1.2vw,18px);line-height:1.5;color:rgba(255,255,255,.7);
    max-width:48ch;margin:0 auto 32px}
  .onda-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .onda-ctas .btn{padding:14px 26px;font-size:14.5px}
  .onda-ctas .btn-primary{background:#fff;color:#000;border-color:#fff}
  .onda-ctas .btn-primary:hover{background:#d62224;color:#fff;border-color:#d62224}
  .onda-ctas .btn-ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px)}

  /* Light mode tweaks */
  [data-theme="light"]{
    --bg:#f4ede0; --surface:#ffffff; --surface-2:#f1ecdf;

  }

  [data-theme="light"] .reel-hole{background:radial-gradient(circle at 40% 30%, #2a2a2e, #050505)}
